Resources:
  # Read by `lightsail.sh deploy`.
  BedrockCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub /${self:custom.servicePrefix}/BedrockCredentials
      Description: Access key of the IAM user the Hermes agent uses to invoke Bedrock.
      SecretString: !Sub '{"access_key_id":"${BedrockAccessKey}","secret_access_key":"${BedrockAccessKey.SecretAccessKey}","region":"${AWS::Region}"}'
